# Builds the website (website/) and publishes it to GitHub Pages on every push to main.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - name: Check the waitlist settings are present
        # Stops a deploy that would ship a waitlist with no database address (the form would say "not available").
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing repository variable(s). In GitHub: Settings > Secrets and variables > Actions > Variables tab, add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (exact names, as Repository variables, not Secrets)."
            exit 1
          fi
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          # Public by design (the publishable key can only call the two waitlist functions).
          # Set them in GitHub: Settings > Secrets and variables > Actions > Variables.
          # NEVER put the Supabase secret key here or anywhere in the website.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
